name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Race / Vet / Build / Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up supported Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
